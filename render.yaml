# Backend on a long-running host (Render). Vercel serverless can't hold the
# /ws/alerts WebSocket or run the APScheduler jobs (escalation, missed
# check-ins, retention purge, disaster feed), so only the frontend lives there.
#
# This file is set up for a FREE demo deployment (see README "Deploying for the phone app"):
# the free web service sleeps after ~15 min idle (first request is then slow, and the
# background jobs/WebSockets pause while it sleeps) and Render's free Postgres expires
# after ~30 days. For an always-on setup change both plans below to paid ones
# (e.g. starter / basic-256mb).
services:
  - type: web
    name: musafir-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    plan: free               # sleeps when idle -> scheduler + sockets pause; use starter for always-on
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: musafir-db, property: connectionString }
      - key: PORT
        value: "8000"        # entrypoint.sh serves on 8000; tells Render where to send traffic + health checks
      - key: CORS_ORIGINS
        # The iOS app's WebView origin and the Android one. Add your website's URL here if it has one.
        value: capacitor://localhost,https://localhost,ionic://localhost
      - key: ALLOWED_HOSTS
        value: "*"           # works on the first deploy; once live, tighten to your host, e.g. musafir-api.onrender.com
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"           # in-memory WS manager + rate limiter are per-process
      # ---- Push & SMS alerts (set in the Render dashboard; secrets are never committed) ----
      - key: PUBLIC_BASE_URL
        sync: false          # your Vercel URL, used for deep links in push/SMS text
      - key: VAPID_PUBLIC_KEY
        sync: false          # python -m app.scripts.generate_vapid_keys
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false          # iOS native push (see backend/.env.example)
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_AUTH_KEY
        sync: false
      - key: APNS_USE_SANDBOX
        value: "true"
      - key: VAPID_SUBJECT
        value: mailto:alerts@example.com   # change to a real contact address
      - key: NOTIFICATION_CHANNEL
        value: console       # demo: SMS is only recorded as "Simulated". Use "twilio" (+ the TWILIO_* values) for real SMS
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # ---- Demo accounts (aarav@example.com, admin@tourism.gov.in, ...) on the hosted copy ----
      # WARNING: the seed script DELETES ALL DATA every time it runs. Leave SEED_ON_START=true for the
      # FIRST deploy only, then set it to false in the Render dashboard (Environment tab).
      - key: SEED_ON_START
        value: "true"
      - key: SEED_FORCE
        value: "true"        # the seed refuses production unless this is set
      - key: SEED_ADMIN_PASSWORD
        sync: false          # choose strong ones: weak/demo passwords (admin123 ...) are refused in production
      - key: SEED_TOURIST_PASSWORD
        sync: false
      - key: SEED_RESPONDER_PASSWORD
        sync: false
      - key: ML_CRIME_INDEX_SOURCE
        value: ncrb
databases:
  - name: musafir-db
    plan: free               # free Postgres expires after ~30 days; use basic-256mb for a permanent one

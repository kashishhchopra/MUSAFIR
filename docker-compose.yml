# One-command deployment: PostgreSQL + FastAPI backend + React/nginx frontend.
#   1. cp .env.example .env   &&  set a strong SECRET_KEY
#   2. docker compose up --build
#   3. open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tourist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourist_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tourist_safety}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourist}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:?set a strong SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tourist}:${POSTGRES_PASSWORD:-tourist_pass}@db:5432/${POSTGRES_DB:-tourist_safety}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      # Seeding is OFF by default. The seed script refuses to run against
      # ENVIRONMENT=production unless SEED_FORCE=true, and no password has a
      # default here: leave SEED_*_PASSWORD empty and strong random ones are
      # generated and printed once to the backend logs. The backend refuses to
      # start in production if any of them is a known weak/demo password.
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_FORCE: ${SEED_FORCE:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_TOURIST_PASSWORD: ${SEED_TOURIST_PASSWORD:-}
      SEED_RESPONDER_PASSWORD: ${SEED_RESPONDER_PASSWORD:-}
      WEB_CONCURRENCY: 1
      # Lets the tourist copilot (services/llm.py) answer open-ended
      # questions the intent router doesn't cover. OPENAI_BASE_URL lets an
      # OpenAI-compatible free provider (Groq, OpenRouter, ...) stand in for
      # OpenAI itself -- set OPENAI_API_KEY (+ OPENAI_MODEL/OPENAI_BASE_URL
      # if not using OpenAI directly) in .env to enable it.
      # Push & SMS alerts (README: "Push & SMS Alerts"). Generate VAPID keys with
      #   docker compose run --rm backend python -m app.scripts.generate_vapid_keys
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:alerts@musafir.example}
      # Push to the Android app: put the Firebase service-account key in ./secrets
      # and set FCM_CREDENTIALS_FILE=/app/secrets/firebase.json (README: "Android app").
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      # Email for password-reset codes (README: "Password reset emails").
      # Gmail: SMTP_USERNAME = the Gmail address, SMTP_PASSWORD = a Google App Password.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MUSAFIR}
      # Google Maps Platform key (Places API (New) + Geocoding): complete place
      # search for Walk-Me-Home etc. Empty = free OpenStreetMap search.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SMS_ALLOWLIST: ${SMS_ALLOWLIST:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-250}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
